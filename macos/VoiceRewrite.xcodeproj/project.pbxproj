    shellPath = /bin/sh;
    shellScript = "set -eu\n# go is required only when BUILDING. At runtime the app uses the absolute Bundle path.\nif ! command -v go >/dev/null 2>&1; then\n  echo \"error: Go toolchain not found; install Go to build bundled voicebridge\" >&2\n  exit 1\nfi\nrepo=\"$SRCROOT/../voice-rewrite\"\nif [ ! -d \"$repo/cmd/voicebridge\" ]; then\n  echo \"error: missing $repo/cmd/voicebridge\" >&2\n  exit 1\nfi\nhelper=\"$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH/voicebridge\"\nmkdir -p \"$(dirname \"$helper\")\"\nwork=\"$(mktemp -d \"$TARGET_TEMP_DIR/voicebridge.XXXXXX\")\"\ntrap 'rm -rf \"$work\"' EXIT\ncd \"$repo\"\nset -- ${ARCHS:-$(uname -m)}\ncount=0\nfor arch in \"$@\"; do\n  case \"$arch\" in\n    arm64|arm64e) goarch=arm64 ;;\n    x86_64) goarch=amd64 ;;\n    *) echo \"error: unsupported macOS arch: $arch\" >&2; exit 1 ;;\n  esac\n  GOOS=darwin GOARCH=\"$goarch\" CGO_ENABLED=0 go build -trimpath -o \"$work/voicebridge-$arch\" ./cmd/voicebridge\n  count=$((count + 1))\ndone\nif [ \"$count\" -eq 1 ]; then\n  cp \"$work/voicebridge-$1\" \"$helper\"\nelse\n  set --\n  for binary in \"$work\"/voicebridge-*; do set -- \"$@\" \"$binary\"; done\n  /usr/bin/xcrun lipo -create \"$@\" -output \"$helper\"\nfi\nchmod 755 \"$helper\"\n# Sign nested executable before Xcode signs the containing app. Debug uses ad-hoc identity.\n/usr/bin/codesign --force --sign - \"$helper\"\n";
};
