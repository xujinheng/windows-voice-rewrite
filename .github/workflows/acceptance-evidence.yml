name: Cross-platform UI acceptance evidence
on:
  pull_request:
    paths:
      - '.github/workflows/acceptance-evidence.yml'
      - 'tests/acceptance/**'
      - 'scripts/capture-acceptance-windows.ps1'
      - 'scripts/test-meeting-ui.ps1'
      - 'voice-rewrite/visual_preview_windows.go'
      - 'voice-rewrite/meeting_ui_e2e_windows_test.go'
      - 'voice-rewrite/settings*.go'
      - 'voice-rewrite/handy_status_windows.go'
      - 'voice-rewrite/popup_windows.go'
      - 'macos/VoiceRewrite/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/acceptance-evidence.yml'
      - 'tests/acceptance/**'
      - 'scripts/capture-acceptance-windows.ps1'
      - 'scripts/test-meeting-ui.ps1'
      - 'voice-rewrite/visual_preview_windows.go'
      - 'voice-rewrite/meeting_ui_e2e_windows_test.go'
      - 'voice-rewrite/settings*.go'
      - 'voice-rewrite/handy_status_windows.go'
      - 'voice-rewrite/popup_windows.go'
      - 'macos/VoiceRewrite/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ui-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --user Pillow
      - run: python3 -m unittest discover -s tests/acceptance -v
      - run: python3 tests/acceptance/manual_matrix.py tests/acceptance/device-matrix.csv
  windows-ui:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: voice-rewrite/go.mod
      - name: Test native popup close actions (Meeting E2E covered separately)
        working-directory: voice-rewrite
        shell: pwsh
        env:
          VOICE_REWRITE_NATIVE_POPUP_TEST: '1'
        run: |
          New-Item -Force -ItemType Directory ../acceptance-output/logs | Out-Null
          go test -count=1 -timeout 4m -run '^TestNativePopupPaintAndClose -v . *>&1 |
            Tee-Object ../acceptance-output/logs/windows-meeting-tests.txt
          if ($LASTEXITCODE -ne 0) { throw 'native popup E2E failed' }
      - name: Build production Windows GUI
        working-directory: voice-rewrite
        shell: pwsh
        run: |
          go build -trimpath -ldflags '-H=windowsgui' -o VoiceRewrite.exe .
          if ($LASTEXITCODE -ne 0) { throw 'GUI build failed' }
      - name: Capture native settings, result card and pill phases
        shell: pwsh
        run: ./scripts/capture-acceptance-windows.ps1
      - name: Native Meeting demo buttons and screenshot E2E
        shell: pwsh
        run: |
          ./scripts/test-meeting-ui.ps1 *>&1 |
            Tee-Object acceptance-output/logs/windows-meeting-capture.txt
          if (-not (Test-Path 'meeting-e2e/diagnostics.json')) { throw 'Meeting capture failed' }
      - name: Record distinct Meeting fixture states
        shell: pwsh
        run: |
          $dir='acceptance-output/windows'
          $m=Get-Content "$dir/manifest.json" -Raw | ConvertFrom-Json
          $cases=@(
            @{source='full-workspace';state='meeting.full'},
            @{source='captions-only';state='meeting.focus'},
            @{source='expanded-english';state='meeting.expanded'},
            @{source='larger-text';state='meeting.large-type'}
          )
          foreach($c in $cases){
            $name="meeting-$($c.source).png"
            Copy-Item "meeting-e2e/$($c.source).png" "$dir/$name"
            $m.captures += [PSCustomObject]@{state=$c.state;fixture='populated-demo-v1';theme='light';locale='zh-CN';scale='logical-1x';image=$name}
          }
          $m | ConvertTo-Json -Depth 7 | Set-Content -Encoding utf8 "$dir/manifest.json"
      - name: Preserve screenshots and logs, including failed runs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-windows
          path: acceptance-output/
          retention-days: 14
          if-no-files-found: warn
  macos-ui:
    name: macOS UI ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-15, arch: arm64, native: arm64, platform: macos-arm64}
          - {runner: macos-15-intel, arch: x64, native: x86_64, platform: macos-x64}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: voice-rewrite/go.mod
      - name: Render actual SwiftUI AppKit production views
        shell: bash
        env:
          VOICEREWRITE_ACCEPTANCE_PLATFORM: ${{ matrix.platform }}
          VOICEREWRITE_ACCEPTANCE_DIR: ${{ github.workspace }}/acceptance-output/${{ matrix.platform }}
        run: |
          set -o pipefail
          mkdir -p acceptance-output/logs "$VOICEREWRITE_ACCEPTANCE_DIR"
          touch acceptance-output/.enabled
          xcodebuild -project macos/VoiceRewrite.xcodeproj \
            -scheme VoiceRewrite -configuration Debug -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/acceptance-build" \
            -resultBundlePath "$RUNNER_TEMP/acceptance.xcresult" \
            -only-testing:VoiceRewriteTests/VisualAcceptanceTests test 2>&1 |
            tee "acceptance-output/logs/$VOICEREWRITE_ACCEPTANCE_PLATFORM-xctest.txt"
          echo "Acceptance manifest path: $VOICEREWRITE_ACCEPTANCE_DIR"
          find acceptance-output -maxdepth 3 -type f -print | sort
          test -f "$VOICEREWRITE_ACCEPTANCE_DIR/manifest.json" || {
            echo "::error::XCTest did not write expected manifest"; exit 1;
          }
          echo "Runner architecture: $(uname -m); expected: ${{ matrix.native }}"
          test "$(uname -m)" = '${{ matrix.native }}'
          app="$RUNNER_TEMP/acceptance-build/Build/Products/Debug/VoiceRewrite.app"
          ls -l "$app/Contents/MacOS/" || true
          test -x "$app/Contents/MacOS/voicebridge" || {
            echo "::error::Xcode acceptance build has no bundled voicebridge"; exit 1;
          }
          file "$app/Contents/MacOS/VoiceRewrite" "$app/Contents/MacOS/voicebridge" |
            tee "acceptance-output/logs/$VOICEREWRITE_ACCEPTANCE_PLATFORM-arch.txt"
      - name: Preserve screenshots and logs even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-${{ matrix.platform }}
          path: acceptance-output/
          retention-days: 14
          if-no-files-found: warn
      - name: Preserve failing Xcode result bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xctest-failure-${{ matrix.platform }}
          path: ${{ runner.temp }}/acceptance.xcresult/
          retention-days: 7
          if-no-files-found: warn
  compare-evidence:
    runs-on: ubuntu-latest
    if: always()
    needs: [validate-evidence, windows-ui, macos-ui]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: acceptance-*
          path: acceptance-output
          merge-multiple: true
      - name: Produce review-only matched-state report
        run: |
          python3 -m pip install --user Pillow
          python3 tests/acceptance/report.py \
            acceptance-output/windows/manifest.json \
            acceptance-output/macos-arm64/manifest.json \
            acceptance-output/macos-x64/manifest.json \
            --output acceptance-report --require-complete-matrix
          cat acceptance-report/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-comparison
          path: acceptance-report/
          retention-days: 14
          if-no-files-found: warn
 -v . *>&1 |
            Tee-Object ../acceptance-output/logs/windows-meeting-tests.txt
          if ($LASTEXITCODE -ne 0) { throw 'native popup E2E failed' }
      - name: Build production Windows GUI
