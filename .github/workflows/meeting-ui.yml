name: Windows Meeting E2E

# Automatic Meeting controls and screenshots are validated by
# acceptance-evidence.yml; this is a manually invoked diagnostic tool.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: meeting-ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  meeting-ui:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: '1.23'
          cache-dependency-path: clients/go.mod
      - name: Verify Go formatting
        working-directory: clients/windows
        shell: pwsh
        run: |
          $unformatted = @(gofmt -l .)
          if ($unformatted.Count -gt 0) {
            gofmt -d $unformatted
            throw "Go files need formatting: $($unformatted -join ', ')"
          }
      - name: Drive production Win32 Meeting controls with live transcript updates
        working-directory: clients/windows
        shell: pwsh
        env:
          VOICEREWRITE_MEETING_E2E: '1'
        run: |
          go test -count=1 -timeout 3m -run '^TestMeetingWindowsE2E$' -v .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build actual Windows GUI executable
        working-directory: clients/windows
        shell: pwsh
        run: |
          go build -trimpath -ldflags '-H=windowsgui' -o VoiceRewrite.exe .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise Meeting window buttons and capture screenshots
        shell: pwsh
        run: ./scripts/test-meeting-ui.ps1
      - name: Upload native Meeting screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Windows-Meeting-E2E-${{ github.run_id }}
          path: meeting-e2e/
          if-no-files-found: warn
          retention-days: 7
