name: Intel Xcode critical-path experiment

# Isolated from required PR CI; no release assets or deployment.
on:
  push:
    branches: [ci/xcode-speed-experiment-*]
    paths:
      - '.github/workflows/xcode-speed-experiment.yml'
      - 'macos/**'
      - 'voice-rewrite/**'
      - 'scripts/macos-bridge-probe.swift'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xcode-speed-experiment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  intel-xcode-a-b:
    name: ${{ matrix.case }} · Intel full XCTest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: xcode16-baseline
            runner: macos-15-intel
            cache: 'off'
          - case: xcode16-no-auto-package-resolution
            runner: macos-15-intel
            cache: 'skip-package'
          - case: xcode26-no-cache
            runner: macos-26-intel
            cache: 'off'
          - case: xcode26-cas-cache
            runner: macos-26-intel
            cache: 'on'
    env:
      COMPILATION_CACHE_DIR: ${{ github.workspace }}/.xcode-compilation-cas
      EXPERIMENT_CASE: ${{ matrix.case }}
      COMPILATION_CACHE_MODE: ${{ matrix.cache }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Record toolchain identity and baseline host
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          xcodebuild -version
          xcrun swift --version
          sw_vers
          printf 'Experiment: %s\nCommit: %s\n' "$EXPERIMENT_CASE" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          xcodebuild -version >> "$GITHUB_STEP_SUMMARY"
      # The CAS store is content-addressed, so keep the same cache key across
      # source changes. Isolate by runner architecture and Xcode major version.
      # Only cache compiler outputs, not the derived build products or tests.
      - name: Restore Xcode 26 compilation CAS
        if: matrix.cache == 'on'
        id: cas
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ github.workspace }}/.xcode-compilation-cas
          key: xcode26-intel-cas-${{ hashFiles('macos/VoiceRewrite.xcodeproj/project.pbxproj', 'macos/**/Package.swift', 'macos/**/Package.resolved') }}-v1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: '1.23.12'
          cache-dependency-path: voice-rewrite/go.mod
      - name: Full native x86_64 XCTest and app/helper verification
        id: xctest
        shell: bash
        env:
          VOICEREWRITE_ACCEPTANCE_PLATFORM: macos-x64
        run: |
          set -euo pipefail
          mkdir -p acceptance-output
          touch acceptance-output/.enabled
          mkdir -p "$COMPILATION_CACHE_DIR"
          # macOS ships Bash 3.2: under set -u, an empty ${array[@]}
          # raises "unbound variable". Pass optional Xcode build settings via
          # a function's positional parameters instead.
          run_xcode() {
            xcodebuild -project macos/VoiceRewrite.xcodeproj \
              -scheme VoiceRewrite -configuration Debug \
              -destination 'platform=macOS' \
              -derivedDataPath "$RUNNER_TEMP/experiment-derived" \
              -resultBundlePath "$RUNNER_TEMP/experiment.xcresult" \
              "$@" test 2>&1 | tee "$RUNNER_TEMP/experiment-xcode.log"
          }
          start="$(date +%s)"
          if [[ "$COMPILATION_CACHE_MODE" == on ]]; then
            run_xcode COMPILATION_CACHE_ENABLE_CACHING=YES \
              "COMPILATION_CACHE_CAS_PATH=$COMPILATION_CACHE_DIR" \
              COMPILATION_CACHE_ENABLE_DIAGNOSTIC_REMARKS=YES
          elif [[ "$COMPILATION_CACHE_MODE" == skip-package ]]; then
            # Local Swift packages only; probe whether automatic dependency
            # resolution is adding critical-path overhead on cold runners.
            run_xcode -disableAutomaticPackageResolution
          else
            run_xcode
          fi
          end="$(date +%s)"
          echo "xcode_seconds=$((end-start))" >> "$GITHUB_OUTPUT"
          app="$RUNNER_TEMP/experiment-derived/Build/Products/Debug/VoiceRewrite.app"
          test -x "$app/Contents/MacOS/VoiceRewrite"
          test -x "$app/Contents/MacOS/voicebridge"
          test "$(lipo -archs "$app/Contents/MacOS/VoiceRewrite")" = x86_64
          test "$(lipo -archs "$app/Contents/MacOS/voicebridge")" = x86_64
          codesign --verify --deep --strict "$app"
          test -s acceptance-output/macos-x64/manifest.json
          grep -q '\*\* TEST SUCCEEDED \*\*' "$RUNNER_TEMP/experiment-xcode.log"
          python3 - "$RUNNER_TEMP/experiment-xcode.log" <<'PY'
          import re, sys
          log = open(sys.argv[1], encoding="utf8", errors="replace").read()
          match = [int(n) for n in re.findall(r"Executed (\d+) tests?, with 0 failures", log)]
          print(f"XCTest passing test counts: {match[-8:]}")
          if not match or max(match) < 69:
              raise SystemExit("Missing full 69-test Intel XCTest coverage")
          PY
      - name: Publish timings and compilation cache size
        if: always()
        shell: bash
        env:
          CACHE_HIT: ${{ steps.cas.outputs.cache-hit }}
          XCODE_SECONDS: ${{ steps.xctest.outputs.xcode_seconds }}
        run: |
          {
            echo "### Intel Xcode experiment"
            echo "- Variant: $EXPERIMENT_CASE"
            echo "- Source SHA: $GITHUB_SHA"
            echo "- Xcode test + build seconds: ${XCODE_SECONDS:-not-finished}"
            echo "- CAS cache hit: ${CACHE_HIT:-not-applicable}"
            echo "- CAS disk usage: $(du -sh "$COMPILATION_CACHE_DIR" 2>/dev/null | cut -f1 || echo none)"
            echo "- XCTest: full scheme, native Intel, including visual fixture captures"
          } >> "$GITHUB_STEP_SUMMARY"
# Measurement repeat 2: unchanged source tree; verify warm CAS restoration.

# Measurement repeat 3: same application source with package-resolution probe.
