name: macOS Go-first headless smoke
on:
  pull_request:
    paths:
      - 'macos/Headless/**'
      - 'scripts/build-macos-headless.sh'
      - 'voice-rewrite/cmd/voicebridge/**'
      - '.github/workflows/macos-headless.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: headless-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  compile:
    name: Headless ${{ matrix.arch }} Swift + Go
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-15, arch: arm64}
          - {runner: macos-15-intel, arch: x86_64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: '1.23'
          cache-dependency-path: voice-rewrite/go.mod
      - name: Compile actual menu-bar app and Go bridge
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = '${{ matrix.arch }}'
          bash scripts/build-macos-headless.sh '${{ matrix.arch }}' "$RUNNER_TEMP/headless"
      - name: Check Info.plist and bundled architecture
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/headless/VoiceRewrite.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSUIElement' "$app/Contents/Info.plist")" = true
          for bin in VoiceRewrite voicebridge; do
            test "$(lipo -archs "$app/Contents/MacOS/$bin")" = '${{ matrix.arch }}'
          done
          codesign --verify --deep --strict "$app"
      - name: Save runnable developer build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: VoiceRewrite-headless-${{ matrix.arch }}
          path: ${{ runner.temp }}/headless/VoiceRewrite.app
          retention-days: 7
          if-no-files-found: error
