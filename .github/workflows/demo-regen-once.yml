name: Regenerate demo media once

on:
  push:
    branches: [docs/demo-english-rewrite]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
      - name: Render updated demo and remove one-off workflow
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'Pillow>=11,<13'
          if ! command -v ffmpeg >/dev/null || ! test -f /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg fonts-noto-cjk
          fi
          python scripts/render-demo-video.py --assets docs/ui --output docs/demo
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          from subprocess import check_output
          root = Path('docs/demo')
          mp4, webp = root/'voicerewrite-demo.mp4', root/'voicerewrite-preview.webp'
          duration = float(check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','default=nw=1:nk=1',str(mp4)],text=True))
          assert 29.9 <= duration <= 30.1, duration
          with Image.open(webp) as img:
              assert img.size==(1280,720) and img.n_frames >= 300
          assert mp4.stat().st_size > 4096 and webp.stat().st_size > 4096
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/demo-regen-once.yml
          git add docs/demo/voicerewrite-demo.mp4 docs/demo/voicerewrite-preview.webp
          git commit -m "docs(demo): regenerate video and animated preview"
          git push origin HEAD:refs/heads/docs/demo-english-rewrite
