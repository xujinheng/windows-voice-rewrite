name: Ready-to-test builds

# Do not build download packages for every intermediate PR commit.
# A bot signals a completed revision by editing its title to add
# [ready-to-test]. Ordinary PR label events no longer create skipped runs.
on:
  pull_request:
    types: [edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ready-to-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ready:
    name: Verify explicit build request
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.action == 'edited' && github.event.changes.title && contains(github.event.pull_request.title, '[ready-to-test]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      revision: ${{ steps.source.outputs.revision }}
    steps:
      - name: Record immutable source revision
        id: source
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Invalid commit SHA"; exit 1; }
          echo "revision=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          printf '### Ready-to-test packages\n\nSource commit: `%s`\n\n' "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo 'Packages are developer builds, not signed/notarized releases.' >> "$GITHUB_STEP_SUMMARY"

  windows:
    name: Ready Windows x64 portable EXE
    needs: ready
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.ready.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: '1.23'
          cache-dependency-path: voice-rewrite/go.mod
      - name: Build runnable EXE
        working-directory: voice-rewrite
        shell: pwsh
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
          SOURCE_SHA: ${{ needs.ready.outputs.revision }}
        run: |
          $ErrorActionPreference = 'Stop'
          go build -trimpath -ldflags '-H=windowsgui -s -w -X main.buildID=0.29.0-dev' -o VoiceRewrite.exe .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hash = (Get-FileHash -Algorithm SHA256 VoiceRewrite.exe).Hash.ToLowerInvariant()
          "EXE source commit: $env:SOURCE_SHA, SHA256: $hash" >> $env:GITHUB_STEP_SUMMARY
      - name: Upload runnable Windows EXE only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: VoiceRewrite-Ready-Windows-x64
          path: voice-rewrite/VoiceRewrite.exe
          retention-days: 14
          if-no-files-found: error

  macos:
    name: Ready macOS ${{ matrix.arch }} headless app
    needs: ready
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-15, arch: arm64}
          - {runner: macos-15-intel, arch: x86_64}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.ready.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: '1.23'
          cache-dependency-path: voice-rewrite/go.mod
      - name: Build headless .app at exact PR revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = '${{ matrix.arch }}'
          bash scripts/build-macos-headless.sh '${{ matrix.arch }}' "$RUNNER_TEMP/ready"
          codesign --verify --deep --strict "$RUNNER_TEMP/ready/VoiceRewrite.app"
      - name: Upload developer app (no DMG or ZIP)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: VoiceRewrite-Ready-macOS-${{ matrix.arch }}
          path: ${{ runner.temp }}/ready/VoiceRewrite.app
          retention-days: 14
          if-no-files-found: error
