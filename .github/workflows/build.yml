name: VoiceRewrite CI, builds and release
on:
  push:
    branches: [main]
    tags: [v*]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

# PRs validate code and compile native executables without producing release
# archives or installers. Main and tags still create complete download artifacts.
# Cancel superseded branch/PR builds, but never cancel a tagged release.
concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      core: ${{ steps.scope.outputs.core }}
      macos: ${{ steps.scope.outputs.macos }}
      windows: ${{ steps.scope.outputs.windows }}
      oneclick: ${{ steps.scope.outputs.oneclick }}
      ui: ${{ steps.scope.outputs.ui }}
      direct2d: ${{ steps.scope.outputs.direct2d }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # On PRs the checkout is a merge commit; fetch its first parent for
          # a zero-extra-runner side-by-side reuse comparison with the base.
          fetch-depth: 2
      - name: Verify CI path classifier
        run: python3 -m unittest discover -s scripts -p 'test_ci_*.py' -v
      - name: Compute affected platforms
        id: scope
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == 'pull_request' ]]; then
            # Include renamed/deleted paths, with no deep clone.
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
              --jq '.[] | .filename, (.previous_filename // empty)' |
              python3 scripts/ci_changes.py --output "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == 'push' && "$GITHUB_REF" == 'refs/heads/main' &&
                  "$BASE_SHA" != '0000000000000000000000000000000000000000' ]]; then
            # Always run full host/core tests on main, but only run supplemental
            # UI/Direct2D capture when a relevant path actually changed.
            # The compare API caps file listings at 300: fail open to full UI
            # testing for such large commits instead of silently missing files.
            gh api "repos/$GITHUB_REPOSITORY/compare/$BASE_SHA...$GITHUB_SHA" \
              --jq 'if (.files | length) >= 300 then ".github/workflows/_large_commit.yml" else .files[] | .filename, (.previous_filename // empty) end' |
              python3 scripts/ci_changes.py --output "$RUNNER_TEMP/ci-scope.txt"
            source "$RUNNER_TEMP/ci-scope.txt"
            printf 'core=true\nmacos=true\nwindows=true\noneclick=true\nui=%s\ndirect2d=%s\n' "$ui" "$direct2d" >> "$GITHUB_OUTPUT"
          else
            # Tags and explicit workflow dispatch validate every host; release
            # signing is gated separately by a trusted v* ref.
            printf 'core=true\nmacos=true\nwindows=true\noneclick=true\nui=false\ndirect2d=false\n' >> "$GITHUB_OUTPUT"
          fi
  test-core:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: '1.23'
          cache-dependency-path: core/go.mod
      - name: Go format
        working-directory: core
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            gofmt -d $files
            exit 1
          fi
      - name: Test core with race detector
        working-directory: core
        run: go test -race -count=1 ./...
      - name: Test native macOS Go bridge helpers without GUI
        working-directory: clients
        run: go test -race -count=1 ./macos/bridge
      - name: Test independent Go CLI and cross-build without native adapters
        working-directory: clients/cli
        run: |
          go test ./...
          CGO_ENABLED=0 go build ./...
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build ./...
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build ./...
      - name: Check portable core package boundaries
        run: python3 scripts/check-portable-core.py
      - name: Audit macOS headless Go source ownership
        run: python3 scripts/check_headless_scope.py
      - name: Compile core on Linux without CGO
        working-directory: core
        env:
          CGO_ENABLED: '0'
        run: go build ./...
  build-macos-headless:
    name: macOS headless ${{ matrix.arch }} Go + Swift
    needs: changes
    if: needs.changes.outputs.macos == 'true' || needs.changes.outputs.oneclick == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-15, arch: arm64}
          - {runner: macos-15-intel, arch: x86_64}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: '1.23'
          cache-dependency-path: clients/go.mod
      - name: Build headless app with in-process Go Core
        if: needs.changes.outputs.macos == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = '${{ matrix.arch }}'
          version=0.1.0
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="${GITHUB_REF_NAME#v}"; fi
          bash scripts/build-macos-headless.sh '${{ matrix.arch }}' "$RUNNER_TEMP/headless" "$version"
      - name: Verify Go-linked production source share
        if: needs.changes.outputs.macos == 'true'
        run: python3 scripts/check_headless_scope.py
      - name: Verify signed binary and basic configuration
        if: needs.changes.outputs.macos == 'true'
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/headless/VoiceRewrite.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSUIElement' "$app/Contents/Info.plist")" = true
          test "$(lipo -archs "$app/Contents/MacOS/VoiceRewrite")" = '${{ matrix.arch }}'
          test ! -e "$app/Contents/MacOS/voicebridge"
          nm -g "$app/Contents/MacOS/VoiceRewrite" | grep ' _VRCommand' >/dev/null
          codesign --verify --deep --strict "$app"
      - name: Smoke native Go ABI and benchmark real Swift-to-Go call overhead
        if: needs.changes.outputs.macos == 'true'
        shell: bash
        run: |
          set -euo pipefail
          swiftc -O -target '${{ matrix.arch }}-apple-macosx13.0' \
            -import-objc-header clients/macos/bridge/VoiceCore.h \
            -framework Foundation -framework Security -framework CoreFoundation \
            -o "$RUNNER_TEMP/voicecore-bench" scripts/bench-macos-core.swift \
            "$RUNNER_TEMP/headless/libvoicecore.a"
          "$RUNNER_TEMP/voicecore-bench"
          # The real host source is compiled with its runtime entrypoint
          # replaced by synthetic AX identities; no microphone/UI is needed.
          # Compile the real adapter once more with a CI-only entrypoint,
          # keeping AX smoke assertions out of the two shipped Swift sources.
          cp clients/macos/app/main.swift "$RUNNER_TEMP/main.swift"
          cat scripts/test-macos-focus.swift >> "$RUNNER_TEMP/main.swift"
          swiftc -O -D FOCUS_GUARD_TEST -target '${{ matrix.arch }}-apple-macosx13.0' \
            -import-objc-header clients/macos/bridge/VoiceCore.h \
            -framework AppKit -framework AVFoundation -framework ApplicationServices \
            -framework CoreGraphics -framework Security -framework CoreFoundation \
            -o "$RUNNER_TEMP/voicecore-focus-test" \
            "$RUNNER_TEMP/main.swift" clients/macos/app/RecordingPill.swift \
            "$RUNNER_TEMP/headless/libvoicecore.a"
          "$RUNNER_TEMP/voicecore-focus-test"
      - name: Test and build portable Apple Silicon OneClick
        if: matrix.arch == 'arm64' && needs.changes.outputs.oneclick == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          cd oneclick
          go test ./...
          go vet ./...
          bundle="$RUNNER_TEMP/Qwen3-ASR-OneClick-Mac-arm64"
          mkdir -p "$bundle"
          go build -trimpath -ldflags '-s -w' -o "$bundle/Qwen3-ASR-OneClick" .
          cp ../LICENSE "$bundle/LICENSE"
          printf '%s\n' '#!/bin/sh' 'cd "$(dirname "$0")" || exit 1' 'exec ./Qwen3-ASR-OneClick' > "$bundle/Start OneClick.command"
          chmod +x "$bundle/Start OneClick.command" "$bundle/Qwen3-ASR-OneClick"
          /usr/bin/codesign --force --sign - --timestamp=none "$bundle/Qwen3-ASR-OneClick"
          /usr/bin/codesign --verify "$bundle/Qwen3-ASR-OneClick"
          if [[ "$GITHUB_REF" == refs/heads/main || "$GITHUB_REF" == refs/tags/v* ]]; then
            /usr/bin/ditto -c -k --keepParent "$bundle" "$RUNNER_TEMP/Qwen3-ASR-OneClick-Mac-arm64.zip"
            extracted="$(mktemp -d)"
            /usr/bin/ditto -x -k "$RUNNER_TEMP/Qwen3-ASR-OneClick-Mac-arm64.zip" "$extracted"
            test -x "$extracted/Qwen3-ASR-OneClick-Mac-arm64/Qwen3-ASR-OneClick"
            test -x "$extracted/Qwen3-ASR-OneClick-Mac-arm64/Start OneClick.command"
            test -f "$extracted/Qwen3-ASR-OneClick-Mac-arm64/LICENSE"
            rm -rf "$extracted"
          fi
      - name: Upload portable Apple Silicon OneClick
        if: matrix.arch == 'arm64' && needs.changes.outputs.oneclick == 'true' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Qwen3-ASR-OneClick-Mac-arm64
          path: ${{ runner.temp }}/Qwen3-ASR-OneClick-Mac-arm64.zip
          retention-days: 7
          if-no-files-found: error
      - name: Package experimental ZIP for tagged Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          out="$RUNNER_TEMP/headless/VoiceRewrite-$version-macOS-${{ matrix.arch }}-Experimental.zip"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/headless/VoiceRewrite.app" "$out"
          unpacked="$(mktemp -d)"
          trap 'rm -rf "$unpacked"' EXIT
          /usr/bin/ditto -x -k "$out" "$unpacked"
          test -x "$unpacked/VoiceRewrite.app/Contents/MacOS/VoiceRewrite"
          /usr/bin/codesign --verify --deep --strict "$unpacked/VoiceRewrite.app"
      - name: Package verified drag-install DMG on main
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          dmg="$RUNNER_TEMP/headless/VoiceRewrite-Dev-macOS-${{ matrix.arch }}.dmg"
          bash scripts/package-macos-dmg.sh "$RUNNER_TEMP/headless/VoiceRewrite.app" "$dmg" '${{ matrix.arch }}'
          bash scripts/verify-macos-package.sh dmg "$dmg" '${{ matrix.arch }}' 0.1.0 dev
      - name: Upload experimental Mac ZIP for the versioned Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: VoiceRewrite-Experimental-macOS-${{ matrix.arch }}
          path: ${{ runner.temp }}/headless/VoiceRewrite-*-macOS-${{ matrix.arch }}-Experimental.zip
          retention-days: 7
          if-no-files-found: error
      - name: Upload developer DMG on main
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: VoiceRewrite-headless-${{ matrix.arch }}
          path: ${{ runner.temp }}/headless/VoiceRewrite-Dev-macOS-${{ matrix.arch }}.dmg
          retention-days: 7
          if-no-files-found: error
  build:
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: '1.23'
          cache-dependency-path: clients/go.mod
      - name: Test
        working-directory: clients/windows
        run: go test ./...
      - name: Vet
        working-directory: clients/windows
        # Win32 callbacks pass OS-owned pointers as uintptr; keep every other vet check.
        run: go vet -unsafeptr=false ./...
      - name: Compile Windows GUI on PRs
        if: github.event_name == 'pull_request'
        working-directory: clients/windows
        shell: pwsh
        run: |
          go build -trimpath -ldflags '-H=windowsgui' -o "$env:RUNNER_TEMP/VoiceRewrite.exe" .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build x64 GUI
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        working-directory: clients/windows
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.29.0-dev' }
          go build -trimpath -ldflags "-H=windowsgui -s -w -X main.buildID=$version" -o VoiceRewrite.exe .
      - name: Package portable Windows release
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: clients/windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path 'package/VoiceRewrite' -Force | Out-Null
          Copy-Item -LiteralPath 'VoiceRewrite.exe' -Destination 'package/VoiceRewrite/'
          Copy-Item -LiteralPath 'README.md' -Destination 'package/VoiceRewrite/'
          Copy-Item -LiteralPath 'config.example.json' -Destination 'package/VoiceRewrite/'
          Copy-Item -LiteralPath '../../LICENSE' -Destination 'package/VoiceRewrite/LICENSE'
          Copy-Item -LiteralPath '../../docs/third-party-notices.md' -Destination 'package/VoiceRewrite/THIRD_PARTY_NOTICES.md'
          Compress-Archive -Path 'package/VoiceRewrite' -DestinationPath 'VoiceRewrite-windows-x64.zip' -Force
          $hash = (Get-FileHash -LiteralPath 'VoiceRewrite-windows-x64.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *VoiceRewrite-windows-x64.zip" | Set-Content -LiteralPath 'SHA256SUMS.txt' -Encoding ascii
      - name: Upload portable release package and checksum
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: VoiceRewrite-portable-windows-x64
          path: |
            clients/windows/VoiceRewrite-windows-x64.zip
            clients/windows/SHA256SUMS.txt
          if-no-files-found: error
      - name: Upload standalone EXE
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: VoiceRewrite-windows-x64
          path: clients/windows/VoiceRewrite.exe
          if-no-files-found: error
      - name: Ensure Inno Setup compiler
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (Test-Path -LiteralPath $compiler) {
            Write-Host 'Inno Setup is already installed.'
          } else {
            choco install innosetup --yes --no-progress --limit-output
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Build per-user installer
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.29.0' }
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler)) { throw "Inno Setup compiler not found: $compiler" }
          & $compiler "/DAppVersion=$version" 'installer\VoiceRewrite.iss'
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed: $LASTEXITCODE" }
          $packages = @(Get-ChildItem -LiteralPath 'installer/output' -Filter 'VoiceRewrite-Setup-*-x64.exe' -File)
          if ($packages.Count -ne 1) { throw 'Expected exactly one installer output' }
          $hash = (Get-FileHash -LiteralPath $packages[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *$($packages[0].Name)" | Set-Content -LiteralPath 'installer/output/INSTALLER-SHA256SUMS.txt' -Encoding ascii
      # On version tags, GitHub signs provenance for the built artifacts via
      # short-lived OIDC credentials. This is NOT Authenticode publisher signing.
      - name: Upload installer and checksum
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: VoiceRewrite-installer-windows-x64
          path: installer/output/*
          if-no-files-found: error
  build-oneclick:
    needs: changes
    if: needs.changes.outputs.oneclick == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: '1.23'
          cache-dependency-path: oneclick/go.mod
      - name: Test OneClick
        working-directory: oneclick
        run: go test ./...
      - name: Vet OneClick
        working-directory: oneclick
        run: go vet ./...
      - name: Build Qwen3-ASR OneClick Windows x64 EXE
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        working-directory: oneclick
        shell: pwsh
        run: go build -trimpath -ldflags '-s -w' -o Qwen3-ASR-OneClick-Windows-x64.exe .
      - name: Stage OneClick executable and license
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path 'oneclick/package' -Force | Out-Null
          Copy-Item -LiteralPath 'oneclick/Qwen3-ASR-OneClick-Windows-x64.exe' -Destination 'oneclick/package/'
          Copy-Item -LiteralPath 'LICENSE' -Destination 'oneclick/package/'
      - name: Upload Qwen3-ASR OneClick executable
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Qwen3-ASR-OneClick-Windows-x64
          path: oneclick/package/*
          if-no-files-found: error
  attest-windows-release:
    name: Attest Windows release packages (trusted tag only)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, build-oneclick]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      # Download exactly the three Windows release artifacts from this workflow
      # run. Do not download third-party or pull-request supplied artifacts.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: VoiceRewrite-portable-windows-x64
          path: provenance
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: VoiceRewrite-installer-windows-x64
          path: provenance
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: Qwen3-ASR-OneClick-Windows-x64
          path: provenance
      - name: Verify release artifacts before attestation
        shell: bash
        run: |
          set -euo pipefail
          test -s provenance/VoiceRewrite-windows-x64.zip
          test -s provenance/Qwen3-ASR-OneClick-Windows-x64.exe
          shopt -s nullglob
          installers=(provenance/VoiceRewrite-Setup-*-x64.exe)
          test "${#installers[@]}" -eq 1
          test -s "${installers[0]}"
          (cd provenance && sha256sum -c SHA256SUMS.txt)
          (cd provenance && sha256sum -c INSTALLER-SHA256SUMS.txt)
      - name: Attest verified portable Windows package
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: provenance/VoiceRewrite-windows-x64.zip
      - name: Attest verified Windows installer
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: provenance/VoiceRewrite-Setup-*-x64.exe
      - name: Attest verified Windows OneClick executable
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: provenance/Qwen3-ASR-OneClick-Windows-x64.exe
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test-core, build-macos-headless, build, build-oneclick, attest-windows-release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Read curated notes from main (not from the tag's historical build
      # snapshot). A release without dedicated notes must fail, never fall back
      # to GitHub's automatic PR/commit history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          path: release-metadata
          sparse-checkout: release-notes
          persist-credentials: false
      - name: Require user-facing release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          notes="release-metadata/release-notes/$RELEASE_TAG.md"
          test -s "$notes" || { echo "Missing curated release notes: $notes" >&2; exit 1; }
          if grep -Eiq 'Full Changelog|New Contributors|Built from commit:|Refreshed with selection-copy|^## What.s Changed|^[-*] ci:|^[-*] CI:' "$notes"; then
            echo "Release notes contain auto-generated or internal development history" >&2
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: VoiceRewrite-*
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: Qwen3-ASR-OneClick-Windows-x64
          path: release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: Qwen3-ASR-OneClick-Mac-arm64
          path: release
      - name: Publish unsigned release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          prerelease: false
          name: VoiceRewrite ${{ github.ref_name }}
          generate_release_notes: false
          body_path: release-metadata/release-notes/${{ github.ref_name }}.md
          overwrite_files: true
          # Public assets include the Windows OneClick ASR server and the two
          # explicitly experimental unnotarized Mac builds; checksums stay in CI.
          files: |
            release/Qwen3-ASR-OneClick-Windows-x64.exe
            release/Qwen3-ASR-OneClick-Mac-arm64.zip
            release/VoiceRewrite-Setup-*-x64.exe
            release/VoiceRewrite-windows-x64.zip
            release/VoiceRewrite-*-macOS-*-Experimental.zip
          fail_on_unmatched_files: true

  # Single-use requested v0.1.1 publication. Only the specifically titled
  # merged main commit can run this, and only after all platform checks pass.
  # GITHUB_TOKEN tag pushes do not themselves trigger workflows, so dispatch
  # the validated tag explicitly. Remove this job after publication.
  tag-v0-1-1:
    name: Publish requested v0.1.1 tag after main validation
    if: >-
      ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'docs(release): prepare v0.1.1') }}
    needs: [changes, test-core, build-macos-headless, build, build-oneclick]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    steps:
      - name: Tag validated commit and dispatch tagged Release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v0.1.1" >/dev/null 2>&1; then
            echo "::notice::v0.1.1 already exists; leaving it unchanged"
            exit 0
          fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref=refs/tags/v0.1.1 -f sha="$GITHUB_SHA"
          # A tag created by GITHUB_TOKEN does not trigger push workflows.
          gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/dispatches" \
            -f ref=v0.1.1

  windows-acceptance:
    name: Windows UI capture (parallel)
    if: ${{ !startsWith(github.ref, 'refs/tags/') && needs.changes.outputs.ui == 'true' }}
    needs: changes
    permissions:
      contents: read
    uses: ./.github/workflows/acceptance-evidence.yml
    with:
      phase: capture

  direct2d-acceptance:
    name: Direct2D result acceptance
    if: needs.changes.outputs.direct2d == 'true' && !startsWith(github.ref, 'refs/tags/')
    needs: changes
    permissions:
      contents: read
    uses: ./.github/workflows/direct2d-result.yml

  ci-gate:
    name: CI Gate
    if: always() && github.event_name == 'pull_request'
    permissions:
      contents: read
    needs: [changes, test-core, build-macos-headless, build, build-oneclick, windows-acceptance, direct2d-acceptance]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require each selected platform and retain Windows UI coverage
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CORE_REQUIRED: ${{ needs.changes.outputs.core }}
          CORE_RESULT: ${{ needs.test-core.result }}
          MAC_REQUIRED: ${{ needs.changes.outputs.macos }}
          MAC_RESULT: ${{ needs.build-macos-headless.result }}
          WIN_REQUIRED: ${{ needs.changes.outputs.windows }}
          WIN_RESULT: ${{ needs.build.result }}
          ONECLICK_REQUIRED: ${{ needs.changes.outputs.oneclick }}
          ONECLICK_RESULT: ${{ needs.build-oneclick.result }}
          UI_REQUIRED: ${{ needs.changes.outputs.ui }}
          UI_CAPTURE_RESULT: ${{ needs.windows-acceptance.result }}
          D2D_REQUIRED: ${{ needs.changes.outputs.direct2d }}
          D2D_RESULT: ${{ needs.direct2d-acceptance.result }}
        run: |
          set -euo pipefail
          test "$CHANGES_RESULT" = success
          check() {
            local label="$1" required="$2" result="$3"
            if [[ "$required" == true ]]; then
              [[ "$result" == success ]] || { echo "::error::$label: $result"; return 1; }
            else
              [[ "$result" == skipped ]] || { echo "::error::$label expected skipped, got $result"; return 1; }
            fi
          }
          check 'Go core' "$CORE_REQUIRED" "$CORE_RESULT"
          check 'macOS headless both architectures' "$MAC_REQUIRED" "$MAC_RESULT"
          check 'Windows' "$WIN_REQUIRED" "$WIN_RESULT"
          check 'OneClick' "$ONECLICK_REQUIRED" "$ONECLICK_RESULT"
          check 'Windows UI capture' "$UI_REQUIRED" "$UI_CAPTURE_RESULT"
          check 'Direct2D' "$D2D_REQUIRED" "$D2D_RESULT"
  macos-signed-distribution:
    name: Publish signed macOS packages
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    permissions:
      contents: write
    uses: ./.github/workflows/macos-distribution.yml
    secrets: inherit
