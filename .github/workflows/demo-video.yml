name: README demo video

on:
  # README screenshot updates are reviewed commits, not bot pushes to protected main.
  push:
    branches: [main]
    paths:
      - 'docs/ui/*.png'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: voicerewrite-demo-video-main
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
      - name: Install video renderer prerequisites
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'Pillow>=11,<13'
          # Install only missing system prerequisites, with at most one apt update.
          packages=()
          if ! command -v ffmpeg >/dev/null; then packages+=(ffmpeg); fi
          if ! test -f /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc; then
            packages+=(fonts-noto-cjk)
          fi
          if ((${#packages[@]})); then
            sudo apt-get update -qq
            sudo apt-get install -y "${packages[@]}"
          fi
          test -f /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
          ffmpeg -hide_banner -version | head -1
      - name: Render walkthrough
        shell: bash
        run: |
          set -euo pipefail
          python scripts/render-demo-video.py --assets docs/ui --output docs/demo
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 docs/demo/voicerewrite-demo.mp4
      - name: Check video files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import subprocess
          directory = Path('docs/demo')
          video=directory/'voicerewrite-demo.mp4'
          webp=directory/'voicerewrite-preview.webp'
          for path in [video,webp]:
              if not path.is_file() or path.stat().st_size<4096:
                  raise SystemExit('Missing/empty demo asset: '+str(path))
          duration=float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','default=noprint_wrappers=1:nokey=1',str(video)],text=True))
          if not 29.9 <= duration <= 30.1:
              raise SystemExit(f'Unexpected demo length {duration}')
          with Image.open(webp) as image:
              if image.format != 'WEBP' or image.size != (1280,720) or image.n_frames < 300:
                  raise SystemExit('README WebP preview must be full HD and animated')
          print('MP4 and animated WebP validated')
          PY
      - name: Upload demo video
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: VoiceRewrite-product-demo-video
          path: |
            docs/demo/voicerewrite-demo.mp4
            docs/demo/voicerewrite-preview.webp
          retention-days: 7
          if-no-files-found: error
