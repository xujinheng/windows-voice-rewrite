name: macOS signed distribution

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# Reusable signed distribution runs after the curated Windows Release is created.
# Without Apple credentials this workflow skips signing: only the separately
# labeled developer CI packages are available, never a counterfeit "notarized" ZIP.
jobs:
  credentials:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
    steps:
      - id: gate
        env:
          CERT: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          SIGN_IDENTITY: ${{ vars.MACOS_DEVELOPER_ID_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_NOTARY_APP_PASSWORD }}
          TEAM: ${{ vars.APPLE_TEAM_ID }}
        run: |
          if [[ -n "$CERT" && -n "$CERT_PASSWORD" && -n "$SIGN_IDENTITY" &&
                -n "$APPLE_ID" && -n "$APPLE_PASSWORD" && -n "$TEAM" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Developer ID and Apple notarization prerequisites present"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Apple credentials unavailable: signed/notarized jobs skipped. Only explicitly labeled developer packages can be built."
          fi

  signed-macos:
    needs: credentials
    if: needs.credentials.outputs.ready == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            public_arch: arm64
          - runner: macos-15-intel
            arch: x86_64
            public_arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: '1.23'
          cache-dependency-path: voice-rewrite/go.mod

      - id: metadata
        name: Derive version from tag or project
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] ||
              { echo "::error::macOS signed releases require vMAJOR.MINOR.PATCH tags"; exit 1; }
          else
            version="0.1.0"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] ||
              { echo "::error::Cannot determine development version"; exit 1; }
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "base=VoiceRewrite-$version-macOS-${{ matrix.public_arch }}-Notarized" >> "$GITHUB_OUTPUT"

      - name: Build single-architecture native app and bundled Go helper
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          CODESIGN_ADHOC=0 bash scripts/build-macos-headless.sh "$ARCH" "$RUNNER_TEMP/release-build" "$VERSION"
          app="$RUNNER_TEMP/release-build/VoiceRewrite.app"
          for executable in VoiceRewrite voicebridge; do
            test -x "$app/Contents/MacOS/$executable"
            test "$(lipo -archs "$app/Contents/MacOS/$executable")" = "$ARCH"
          done
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$VERSION"

      - name: Developer ID sign, notarize, staple and verify application
        env:
          CERT: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          SIGN_IDENTITY: ${{ vars.MACOS_DEVELOPER_ID_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_NOTARY_APP_PASSWORD }}
          TEAM: ${{ vars.APPLE_TEAM_ID }}
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ steps.metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/release-build/VoiceRewrite.app"
          keychain="$RUNNER_TEMP/voicerewrite-release.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          cleanup() { security delete-keychain "$keychain" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          printf '%s' "$CERT" | base64 -D > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security find-identity -v -p codesigning "$keychain"

          # Sign leaf code before its enclosing app. No --deep --force blanket re-sign.
          if [[ -d "$app/Contents/Frameworks" ]]; then
            while IFS= read -r -d '' nested; do
              codesign --force --timestamp --options runtime --sign "$SIGN_IDENTITY" "$nested"
            done < <(find "$app/Contents/Frameworks" -depth \( -name '*.dylib' -o -name '*.framework' \) -print0)
          fi
          codesign --force --timestamp --options runtime --sign "$SIGN_IDENTITY" \
            "$app/Contents/MacOS/voicebridge"
          codesign --force --timestamp --options runtime --sign "$SIGN_IDENTITY" \
            --entitlements scripts/macos-hardened.entitlements "$app"
          bash scripts/verify-macos-package.sh app "$app" "$ARCH" "$VERSION" signed

          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$app" "$RUNNER_TEMP/app-for-notary.zip"
          xcrun notarytool submit "$RUNNER_TEMP/app-for-notary.zip" --apple-id "$APPLE_ID" \
            --team-id "$TEAM" --password "$APPLE_PASSWORD" --wait --output-format json \
            > "$RUNNER_TEMP/app-notary.json"
          python3 - "$RUNNER_TEMP/app-notary.json" <<'PY'
          import json, sys
          result = json.load(open(sys.argv[1], encoding="utf-8"))
          if result.get("status") != "Accepted":
              sys.exit("Apple rejected app notarization: " + str(result.get("id")) + " (" + str(result.get("status")) + ")")
          PY
          xcrun stapler staple "$app"
          bash scripts/verify-macos-package.sh app "$app" "$ARCH" "$VERSION" notarized

      - name: Package and notarize ZIP and drag-install DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_NOTARY_APP_PASSWORD }}
          TEAM: ${{ vars.APPLE_TEAM_ID }}
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ steps.metadata.outputs.version }}
          BASE: ${{ steps.metadata.outputs.base }}
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/release-build/VoiceRewrite.app"
          mkdir -p "$RUNNER_TEMP/dist"
          zip="$RUNNER_TEMP/dist/$BASE.zip"
          dmg="$RUNNER_TEMP/dist/$BASE.dmg"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$app" "$zip"
          (cd "$RUNNER_TEMP/dist" && shasum -a 256 "$(basename "$zip")" > "$(basename "$zip").sha256")
          bash scripts/verify-macos-package.sh zip "$zip" "$ARCH" "$VERSION" notarized

          bash scripts/package-macos-dmg.sh "$app" "$dmg" "$ARCH"
          bash scripts/verify-macos-package.sh dmg "$dmg" "$ARCH" "$VERSION" signed
          xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --team-id "$TEAM" \
            --password "$APPLE_PASSWORD" --wait --output-format json > "$RUNNER_TEMP/dmg-notary.json"
          python3 - "$RUNNER_TEMP/dmg-notary.json" <<'PY'
          import json, sys
          result = json.load(open(sys.argv[1], encoding="utf-8"))
          if result.get("status") != "Accepted":
              sys.exit("Apple rejected DMG notarization: " + str(result.get("id")) + " (" + str(result.get("status")) + ")")
          PY
          xcrun stapler staple "$dmg"
          # Ticket stapling changes the DMG bytes; regenerate its hash afterwards.
          (cd "$RUNNER_TEMP/dist" && shasum -a 256 "$(basename "$dmg")" > "$(basename "$dmg").sha256")
          bash scripts/verify-macos-package.sh dmg "$dmg" "$ARCH" "$VERSION" notarized

      - name: Upload only verified signed/notarized packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: VoiceRewrite-macOS-${{ matrix.public_arch }}-Notarized
          path: ${{ runner.temp }}/dist/*
          retention-days: 30
          if-no-files-found: error

  publish-macos:
    needs: signed-macos
    if: startsWith(github.ref, 'refs/tags/v') && needs.signed-macos.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: VoiceRewrite-macOS-*-Notarized
          path: release-macos
          merge-multiple: true
      - name: Verify both architectures and all download hashes
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          for arch in arm64 x64; do
            base="VoiceRewrite-$version-macOS-$arch-Notarized"
            for ext in zip dmg; do
              test -s "release-macos/$base.$ext"
              test -s "release-macos/$base.$ext.sha256"
              (cd release-macos && shasum -a 256 -c "$base.$ext.sha256")
            done
          done
          test "$(find release-macos -maxdepth 1 -type f | wc -l | tr -d ' ')" = 8
      - name: Append to the curated Windows GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Windows' release job has already created the curated release.
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null ||
            { echo "::error::Curated Windows Release not found"; exit 1; }
          gh release upload "$GITHUB_REF_NAME" release-macos/* --repo "$GITHUB_REPOSITORY" --clobber
